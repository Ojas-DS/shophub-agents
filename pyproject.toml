[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shophub-agents"
version = "0.1.0"
description = "Multi-tenant order-support agents for ShopHub: LangGraph orchestrator + A2A orders sub-agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "a2a-sdk[http-server,postgresql,sqlite]==0.3.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "asgi-lifespan>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
